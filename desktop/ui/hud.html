<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DigitalSoul HUD Overlay</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="hud-body">
  <div id="hud-root" class="hud-root idle">
    <!-- Top HUD Toolbar (Interactive controls & Click-Through indicator) -->
    <header id="hud-toolbar" class="hud-toolbar" aria-label="Ghost Pilot Controls">
      <div id="hud-status-badge" class="hud-chip click-through" title="Overlay is click-through. Press Ctrl+F8 or click here to toggle interactive mode.">
        <span class="hud-chip-dot"></span>
        <span id="hud-chip-label">Ghost Pilot HUD • Click-Through (Ctrl+F8)</span>
      </div>
      <div id="hud-interactive-controls" class="hud-interactive-controls hidden">
        <button id="hud-pause-btn" class="hud-btn hud-btn-stop" title="Stop current execution (F8)">■ Stop (F8)</button>
        <button id="hud-clickthrough-btn" class="hud-btn hud-btn-mode" title="Lock click-through mode">Lock Click-Through</button>
      </div>
    </header>

    <!-- Glowing Target Reticle & Bounding Box -->
    <div id="target-reticle" class="target-reticle hidden" aria-hidden="true">
      <div class="reticle-frame">
        <span class="reticle-corner top-left"></span>
        <span class="reticle-corner top-right"></span>
        <span class="reticle-corner bottom-left"></span>
        <span class="reticle-corner bottom-right"></span>
        <div class="reticle-scanline"></div>
        <div class="reticle-crosshair"></div>
      </div>
      <div id="reticle-label-wrap" class="reticle-label-wrap">
        <span class="reticle-icon">⌖</span>
        <span id="reticle-label" class="reticle-label">Targeting: Control</span>
      </div>
    </div>

    <!-- Truthful Browser-Level Status Card (used when exact element pixel coordinates are not calibrated) -->
    <aside id="browser-hud-card" class="browser-hud-card hidden" aria-live="polite">
      <div class="browser-hud-icon">🌐</div>
      <div class="browser-hud-info">
        <div class="browser-hud-meta">
          <span class="browser-tag" id="browser-hud-app">Microsoft Edge</span>
          <span class="browser-step-badge" id="browser-hud-step">Step 1 of 1</span>
        </div>
        <div class="browser-hud-target" id="browser-hud-target">Targeting: Product Title</div>
        <div class="browser-hud-action" id="browser-hud-action">Typing product title</div>
      </div>
    </aside>

    <!-- Floating Ghost Pilot Avatar -->
    <div id="ghost-pilot" class="ghost-pilot parked" aria-hidden="true">
      <div class="ghost-aura"></div>
      <svg class="cursor-ghost" viewBox="0 0 32 32" aria-hidden="true">
        <path class="body" d="M16 3.5C10 3.5 6 7.9 6 13.8V26.6Q8 28.2 10 26.6T14 26.6T18 26.6T22 26.6T26 26.6V13.8C26 7.9 22 3.5 16 3.5Z"/>
        <ellipse class="eye eye-l" cx="12.4" cy="14" rx="1.7" ry="2.2"/>
        <ellipse class="eye eye-r" cx="19.6" cy="14" rx="1.7" ry="2.2"/>
        <ellipse class="cheek" cx="10.2" cy="17.6" rx="1.5" ry=".9"/>
        <ellipse class="cheek" cx="21.8" cy="17.6" rx="1.5" ry=".9"/>
        <path class="mouth" d="M14.6 18.2q1.4 1.3 2.8 0"/>
      </svg>
      <!-- Floating Action Status Message -->
      <div id="ghost-status-bubble" class="ghost-status-bubble">
        <span id="ghost-status-text">Ghost Pilot Ready</span>
      </div>
    </div>

    <!-- Completion / Failure Banner Toast -->
    <div id="completion-toast" class="completion-toast hidden" role="status">
      <span id="completion-icon" class="completion-icon">✓</span>
      <div class="completion-content">
        <div id="completion-title" class="completion-title">Workflow Succeeded</div>
        <div id="completion-subtitle" class="completion-subtitle">Docking back to notch…</div>
      </div>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
